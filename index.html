<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#d9480f"><link rel="icon" href="icon-192.png"><title>Caixa do Restaurante</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--tx:#1d1d1b;--mu:#6b6a66;--bd:#e3e1db;--in:#1a8a4a;--out:#c93a2e;--ac:#d9480f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161615;--card:#222221;--tx:#f1efe9;--mu:#a09e96;--bd:#33322f;--in:#4cc27f;--out:#ef6b5f;--ac:#ff8a4c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#161615;--card:#222221;--tx:#f1efe9;--mu:#a09e96;--bd:#33322f;--in:#4cc27f;--out:#ef6b5f;--ac:#ff8a4c;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;padding:12px;max-width:560px;margin:0 auto}
.sum{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px}
.c small{color:var(--mu);display:block;font-size:12px}.c b{font-size:17px}
.tabs{display:flex;gap:6px;margin:12px 0}
.tabs button{flex:1;padding:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font-size:15px}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
h3{margin:14px 0 6px;font-size:14px;color:var(--mu);text-transform:uppercase;letter-spacing:.04em}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.p{padding:14px 8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;font-size:15px}
.p span{display:block;color:var(--in);font-weight:700;margin-top:2px}
.p:active{transform:scale(.97)}
.row{display:flex;gap:6px;margin-bottom:6px}
input{flex:1;min-width:0;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font-size:16px}
.go{padding:12px 14px;border:0;border-radius:10px;color:#fff;font-weight:600;font-size:15px}
.li{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--bd)}
.li small{color:var(--mu)}.x{border:0;background:none;color:var(--mu);font-size:20px;padding:4px 10px}
.in{color:var(--in)}.out{color:var(--out)}
</style></head><body>
<div class="sum">
<div class="c"><small>Entradas</small><b class="in" id="ti">R$ 0,00</b></div>
<div class="c"><small>Saídas</small><b class="out" id="to">R$ 0,00</b></div>
<div class="c"><small>Saldo</small><b id="ts">R$ 0,00</b></div></div>
<div class="tabs"><button data-t="h" class="on">Hoje</button><button data-t="p">Produtos</button><button data-t="d">Dias</button></div>
<div id="v"></div>
<script>
const K="caixa_v1";let S={products:[],moves:[]},tab="h";
try{const r=localStorage.getItem(K);if(r)S=JSON.parse(r)}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const R=n=>"R$ "+n.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
const day=t=>new Date(t).toLocaleDateString("sv-SE");
const num=s=>parseFloat(String(s).replace(",","."))||0;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const today=()=>S.moves.filter(m=>day(m.ts)===day(Date.now()));
const add=(t,v,d)=>{if(v>0){S.moves.push({id:Date.now()+Math.random(),t,v,d:d||"",ts:Date.now()});save();draw()}};
const sums=a=>{let i=0,o=0;a.forEach(m=>m.t==="in"?i+=m.v:o+=m.v);return[i,o]};
function draw(){
const[i,o]=sums(today());ti.textContent=R(i);to.textContent=R(o);ts.textContent=R(i-o);ts.className=i-o<0?"out":"in";
document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on",b.dataset.t===tab));
let h="";
if(tab==="h"){
h+="<h3>Toque para vender</h3><div class='grid'>"+(S.products.length?S.products.map(p=>`<button class="p" data-s="${p.id}">${esc(p.name)}<span>${R(p.price)}</span></button>`).join(""):"<p style='color:var(--mu);grid-column:1/3'>Cadastre produtos na aba Produtos.</p>")+"</div>";
h+="<h3>Venda avulsa</h3><div class='row'><input id='sv' inputmode='decimal' placeholder='Valor'><button class='go' style='background:var(--in)' id='bs'>+ Venda</button></div>";
h+="<h3>Despesa</h3><div class='row'><input id='ev' inputmode='decimal' placeholder='Valor'><input id='ed' placeholder='O quê? (opcional)'></div><button class='go' style='background:var(--out);width:100%' id='be'>− Lançar despesa</button>";
h+="<h3>Movimentos de hoje</h3>"+(today().slice().reverse().map(m=>`<div class="li"><div>${m.t==="in"?"Venda":"Despesa"}${m.d?" · "+esc(m.d):""}<br><small>${new Date(m.ts).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})}</small></div><div><b class="${m.t}">${m.t==="in"?"+":"−"}${R(m.v)}</b><button class="x" data-x="${m.id}">×</button></div></div>`).join("")||"<small style='color:var(--mu)'>Nada lançado ainda.</small>");
}
if(tab==="p"){
h+="<h3>Novo produto</h3><div class='row'><input id='pn' placeholder='Nome'><input id='pp' inputmode='decimal' placeholder='Preço' style='max-width:100px'></div><button class='go' style='background:var(--ac);width:100%' id='bp'>Adicionar</button><h3>Cadastrados</h3>"+S.products.map(p=>`<div class="li"><div>${esc(p.name)}</div><div><b>${R(p.price)}</b><button class="x" data-dp="${p.id}">×</button></div></div>`).join("");
}
if(tab==="d"){
const g={};S.moves.forEach(m=>(g[day(m.ts)]=g[day(m.ts)]||[]).push(m));
h+="<h3>Resumo por dia</h3>"+(Object.keys(g).sort().reverse().map(k=>{const[a,b]=sums(g[k]);return`<div class="li"><div>${k.split("-").reverse().join("/")}<br><small>Entrou ${R(a)} · Saiu ${R(b)}</small></div><b class="${a-b<0?"out":"in"}">${R(a-b)}</b></div>`}).join("")||"<small style='color:var(--mu)'>Sem histórico.</small>");
}
v.innerHTML=h}
document.addEventListener("click",e=>{
const t=e.target.closest("button");if(!t)return;
if(t.dataset.t){tab=t.dataset.t;draw()}
else if(t.dataset.s){const p=S.products.find(p=>p.id==t.dataset.s);add("in",p.price,p.name)}
else if(t.dataset.x){S.moves=S.moves.filter(m=>m.id!=t.dataset.x);save();draw()}
else if(t.dataset.dp){if(confirm("Remover produto?")){S.products=S.products.filter(p=>p.id!=t.dataset.dp);save();draw()}}
else if(t.id==="bs")add("in",num(sv.value),"")
else if(t.id==="be")add("out",num(ev.value),ed.value.trim())
else if(t.id==="bp"){const n=pn.value.trim(),p=num(pp.value);if(n&&p>0){S.products.push({id:Date.now(),name:n,price:p});save();draw()}}
});
draw();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
